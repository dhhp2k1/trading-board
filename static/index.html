<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交易看板</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="news.css">
</head>
<body>
<div id="topbar">
  <span class="logo"><img src="img/logo.svg" alt="">TB<b>TERMINAL</b></span>
  <button id="btnMini" class="minibtn" title="打开桌面小窗（置顶的迷你自选）">▣ 小窗</button>
  <span id="ver" class="ver" title="版本"></span>
  <button id="updBtn" class="upd" style="display:none" onclick="doUpdate()"></button>
  <div class="cmd">
    <span class="prompt">&gt;</span>
    <input id="addInput" placeholder="输入代码或名称：600519 / 00700 / AAPL / ^N225，回车加入自选" autocomplete="off" spellcheck="false">
    <span class="go">GO</span>
    <div id="suggest"></div>
  </div>
  <div id="clocks"></div>
</div>
<header id="ticker"></header>

<main>
  <aside id="left" class="panel">
    <div class="ph"><span class="pn">1</span> 自选监控 <span class="muted" id="watchCount"></span></div>
    <div id="miniBar" class="pywebview-drag-region">
      <img src="img/logo.svg" alt="" class="pywebview-drag-region">
      <select id="miniGroup"></select>
      <span id="miniClock" class="pywebview-drag-region"></span>
      <span class="mb">
        <button id="miniPin" title="窗口置顶">📌</button>
        <button id="miniMain" title="打开主窗口">⤢</button>
        <button id="miniClose" title="关闭小窗">✕</button>
      </span>
    </div>
    <div class="tabs" id="groupTabs"></div>
    <div id="heat"></div>
    <div id="miniGrip" title="拖动调整小窗大小"></div>
    <table id="watch">
      <thead><tr>
        <th data-sort="name">证券</th>
        <th class="spk">走势</th>
        <th data-sort="price" class="r num">最新</th>
        <th data-sort="pct" class="r pct">涨跌幅</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="leftfoot">
      <button id="btnImport">导入</button>
      <button id="btnExport">导出</button>
      <button id="btnNewGroup">新分组</button>
      <button id="btnManage">整理</button>
    </div>
  </aside>

  <section id="center" class="panel">
    <div class="ph"><span class="pn">2</span> 图表 <span id="cName"></span><span id="cCode" class="muted"></span>
      <span id="cPrice" class="big"></span><span id="cPct"></span></div>
    <div class="toolbar">
      <div class="seg" id="periods">
        <button data-p="min">分时</button>
        <button data-p="m1">1分</button>
        <button data-p="m5">5分</button>
        <button data-p="m15">15分</button>
        <button data-p="m30">30分</button>
        <button data-p="m60">60分</button>
        <button data-p="day">日</button>
        <button data-p="week">周</button>
        <button data-p="month">月</button>
      </div>
      <div id="ovl">
        <button id="btnOverlay" title="叠加其他标的走势，按涨跌幅对比">＋叠加</button>
        <span id="ovlChips"></span>
        <div id="ovlPop">
          <input id="ovlInput" placeholder="代码或名称，回车添加">
          <div id="ovlList"></div>
        </div>
      </div>
      <div class="seg" id="ctypes">
        <button data-t="candle" title="蜡烛图">蜡烛</button>
        <button data-t="hollow" title="空心蜡烛">空心</button>
        <button data-t="bar" title="美国线（OHLC）">美国线</button>
        <button data-t="line" title="收盘价折线">折线</button>
      </div>
    </div>
    <div id="chart"></div>
    <div id="legend" class="muted"></div>
  </section>

  <aside id="right" class="panel">
    <div class="ph"><span class="pn">3</span> 报价详情</div>
    <dl id="detail"></dl>
    <!-- 资讯面板：由"资讯"子任务在 news.js / news.css 中实现，这里只留容器 -->
    <section id="news"></section>
    <div class="ph"><span class="pn">4</span> 我的 Agent</div>
    <div class="pad"><button id="btnAgent" disabled title="第 4 步接入">带上当前标的去问 Agent（待接入）</button></div>
  </aside>
</main>

<footer>
  <span id="status">启动中…</span>
  <span>
    <button id="btnLook" class="look" title="主题、自选栏显示方式">◐ 外观</button>
    刷新
    <select id="interval">
      <option value="2000">2s</option>
      <option value="3000" selected>3s</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
    </select>
    <label><input type="checkbox" id="redUp" checked> 红涨绿跌</label>
  </span>
</footer>

<div id="lookPop">
  <div class="lk-h">主题</div>
  <div class="lk-themes" id="lkThemes"></div>
  <div class="lk-h">自选栏</div>
  <div class="lk-seg" id="lkView"><button data-v="list">列表</button><button data-v="heat">热力图</button></div>
  <label><input type="checkbox" data-o="spark"> 日内走势小图</label>
  <label><input type="checkbox" data-o="range"> 日内高低区间条</label>
  <label><input type="checkbox" data-o="pill"> 涨跌幅色块（越深涨跌越大）</label>
  <label><input type="checkbox" data-o="change"> 显示涨跌额</label>
  <label><input type="checkbox" data-o="prem"> ETF 溢价率</label>
  <label><input type="checkbox" data-o="dense"> 紧凑行高</label>
</div>
<dialog id="manageDlg">
  <div class="ph">整理自选</div>
  <div class="pad">
    <div class="imp-head">
      <span>分组 <select id="mgGroup"></select> <span id="mgSummary" class="muted"></span></span>
      <span class="seg">
        <button id="mgAll">全选</button><button id="mgNone">全不选</button><button id="mgInv">反选</button><button id="mgBad">选中无行情的</button>
      </span>
    </div>
    <div class="imp-tablewrap">
      <table id="mgTable">
        <thead><tr><th></th><th>名称</th><th>代码</th><th class="r">最新</th><th>状态</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="dlgbtns">
      <span class="muted" style="margin-right:auto">点击行可勾选，按住 Shift 可连选</span>
      <button id="mgMove">移动到…</button>
      <select id="mgMoveTo" style="display:none"></select>
      <button id="mgDel" class="danger">删除所选</button>
      <button id="mgClear" class="danger">清空本分组</button>
      <button id="mgClose">完成</button>
    </div>
  </div>
</dialog>
<dialog id="importDlg">
  <div class="ph">导入自选</div>
  <div class="pad" id="impStep1">
    <p class="muted">支持：同花顺持仓 / 自选（直接复制表格粘贴，含"证券代码"列）、TradingView 导出的自选（.txt，如
      <code>NASDAQ:AAPL,SSE:600519,###分组</code>）、CSV 第一列为代码、或每行一个代码。</p>
    <input type="file" id="importFile" accept=".txt,.csv,.xls,.tsv">
    <textarea id="importText" rows="10" placeholder="把内容粘贴到这里，下一步会先让你确认再导入"></textarea>
    <div class="dlgbtns">
      <button id="importNext">下一步：预览</button>
      <button id="importCancel">关闭</button>
    </div>
    <p id="importMsg" class="muted"></p>
  </div>
  <div class="pad" id="impStep2" style="display:none">
    <div class="imp-head">
      <span id="impSummary"></span>
      <span>导入到
        <select id="impTarget"></select>
        <input id="impNewGroup" placeholder="新分组名称" style="display:none; width: 9rem">
      </span>
    </div>
    <div class="imp-tablewrap">
      <table id="impTable">
        <thead><tr><th><input type="checkbox" id="impAll" checked></th><th>原始代码</th><th>名称</th><th>识别为</th><th>市场</th><th>状态</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <label><input type="checkbox" id="importReplace"> 清空目标分组后再导入（不勾选则追加）</label>
    <div class="dlgbtns">
      <button id="impBack">返回修改</button>
      <button id="impConfirm" class="primary">确认导入</button>
    </div>
  </div>
</dialog>

<script src="lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
<script src="news.js" onerror="void 0"></script>
</body>
</html>
