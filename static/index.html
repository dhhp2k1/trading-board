<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交易看板</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css?v=0.8.18">
<link rel="stylesheet" href="news.css?v=0.8.18">
<link rel="stylesheet" href="ecocal.css?v=0.8.18">
</head>
<body>
<div id="topbar">
  <button id="btnMini" class="minibtn" title="切换成置顶的迷你自选小窗（可随时切回）">▣ 小窗</button>
  <span id="ver" class="ver" title="版本"></span>
  <button id="updBtn" class="upd" style="display:none" onclick="doUpdate()"></button>
  <div class="cmd">
    <span class="prompt">&gt;</span>
    <input id="addInput" placeholder="代码或名称" autocomplete="off" spellcheck="false">
    <span class="go">GO</span>
    <div id="suggest"></div>
  </div>
  <div id="clocks"></div>
</div>
<header id="ticker"></header>

<main>
  <aside id="left" class="panel">
    <div class="ph panel-heading watch-heading" id="watchHeading">自选监控 <span id="watchCount"></span></div>
    <div id="miniBar" class="pywebview-drag-region">
      <img src="img/logo.svg" alt="" class="pywebview-drag-region">
      <select id="miniGroup"></select>
      <span id="miniClock" class="pywebview-drag-region"></span>
      <span class="mb">
        <button id="miniPin" title="窗口置顶">📌</button>
        <button id="miniMain" title="切回完整界面">⤢ 完整界面</button>
      </span>
    </div>
    <div class="tabs" id="groupTabs"></div>
    <details id="groupBrief" hidden>
      <summary>自选组涨跌分布</summary>
      <div id="groupBreadth"></div>
      <small id="groupCoverage" class="muted"></small>
    </details>
    <div id="heat"></div>
    <div id="watchScroll">
      <table id="watch" role="table" aria-labelledby="watchHeading">
        <thead role="rowgroup"><tr role="row">
          <th role="columnheader" scope="col"><button data-sort="name">证券</button></th>
          <th role="columnheader" scope="col" class="watch-spark-head" id="watchSparkHead">走势</th>
          <th role="columnheader" scope="col" class="watch-price-head"><button data-sort="price">最新</button></th>
          <th role="columnheader" scope="col" class="watch-pct-head"><button data-sort="pct">涨跌幅</button></th>
        </tr></thead>
        <tbody role="rowgroup"></tbody>
      </table>
    </div>
    <div class="leftfoot">
      <button id="btnImport">导入</button>
      <button id="btnExport">导出</button>
      <button id="btnNewGroup">新分组</button>
      <button id="btnManage">整理</button>
    </div>
  </aside>

  <section id="center" class="panel">
    <div class="ph panel-heading">图表 <span id="cName"></span><span id="cCode" class="muted"></span>
      <span id="cPrice" class="big"></span><span id="cPct"></span><button id="cAdd" title="加入当前分组">＋ 加自选</button>
      <button id="etfPeersOpen" type="button" aria-haspopup="dialog" hidden>ETF 对照</button></div>
    <div class="toolbar">
      <div class="seg" id="periods">
        <button data-p="min">分时</button>
        <button data-p="m1">1分</button>
        <button data-p="m5">5分</button>
        <button data-p="m15">15分</button>
        <button data-p="m30">30分</button>
        <button data-p="m60">60分</button>
        <button data-p="day">日</button>
        <button data-p="week">周</button>
        <button data-p="month">月</button>
      </div>
      <div id="ovl">
        <button id="btnOverlay" title="叠加其他标的走势，按涨跌幅对比">＋叠加</button>
        <span id="ovlChips"></span>
        <div id="ovlPop">
          <input id="ovlInput" placeholder="代码或名称，回车添加">
          <div id="ovlList"></div>
        </div>
      </div>
      <div class="seg" id="ctypes">
        <button data-t="candle" title="蜡烛图">蜡烛</button>
        <button data-t="hollow" title="空心蜡烛">空心</button>
        <button data-t="bar" title="美国线（OHLC）">美国线</button>
        <button data-t="line" title="收盘价折线">折线</button>
      </div>
      <div class="seg" id="drawTools" role="group" aria-label="划线">
        <button data-draw="trend" aria-pressed="false" title="点击两个点绘制趋势线" disabled>趋势线</button>
        <button data-draw="horizontal" aria-pressed="false" title="点击价格绘制水平线" disabled>水平线</button>
        <button id="drawUndo" title="撤销当前图表的最后一条线" disabled>撤销划线</button>
      </div>
    </div>
    <section id="intradayContext" aria-label="盘中相对走势" hidden>
      <div id="industryBlock" hidden><strong id="industryName"></strong> <span id="industryStats"></span>
        <button type="button" id="industryPlot" hidden>叠加行业分时</button>
        <small id="industryMeta"></small></div>
    </section>
    <div id="chartFrame">
      <div id="chart"></div>
    </div>
    <div id="legend" class="muted"></div>
  </section>

  <aside id="right" class="panel">
    <div class="ph panel-heading">报价详情</div>
    <section id="detail" aria-labelledby="quoteTitle">
      <div id="detailQuote"></div>
      <div id="detailHistory"></div>
    </section>
    <!-- 资讯面板：由"资讯"子任务在 news.js / news.css 中实现，这里只留容器 -->
    <section id="news"></section>
    <div class="ph"><span class="pn">4</span> 我的 Agent</div>
    <div class="pad"><button id="btnAgent" disabled title="第 4 步接入">带上当前标的去问 Agent（待接入）</button></div>
  </aside>
</main>

<footer>
  <span id="status">启动中…</span>
  <span>
    <button id="btnLook" class="look" title="主题、自选栏显示方式">◐ 外观</button>
    刷新
    <select id="interval">
      <option value="2000">2s</option>
      <option value="3000" selected>3s</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
    </select>
    <label><input type="checkbox" id="redUp" checked> 红涨绿跌</label>
  </span>
</footer>

<div id="lookPop">
  <div class="lk-h">主题</div>
  <div class="lk-themes" id="lkThemes"></div>
  <div class="lk-h">自选栏</div>
  <div class="lk-seg" id="lkView"><button data-v="list">列表</button><button data-v="heat">热力图</button></div>
  <label><input type="checkbox" data-o="spark"> 日内走势小图</label>
  <label><input type="checkbox" data-o="range"> 日内高低区间条</label>
  <label><input type="checkbox" data-o="pill"> 涨跌幅色块（越深涨跌越大）</label>
  <label><input type="checkbox" data-o="change"> 显示涨跌额</label>
  <label><input type="checkbox" data-o="prem"> ETF 溢价率</label>
  <label><input type="checkbox" data-o="dense"> 紧凑行高</label>
</div>
<dialog id="manageDlg">
  <div class="ph">整理自选</div>
  <div class="pad">
    <div class="imp-head">
      <span>分组 <select id="mgGroup"></select> <span id="mgSummary" class="muted"></span></span>
      <span class="seg">
        <button id="mgAll">全选</button><button id="mgNone">全不选</button><button id="mgInv">反选</button><button id="mgBad">选中无行情的</button>
      </span>
    </div>
    <div class="imp-tablewrap">
      <table id="mgTable">
        <thead><tr><th></th><th>名称</th><th>代码</th><th class="r">最新</th><th>状态</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="dlgbtns">
      <span class="muted" style="margin-right:auto">点击行可勾选，按住 Shift 可连选</span>
      <button id="mgMove">移动到…</button>
      <select id="mgMoveTo" style="display:none"></select>
      <button id="mgDel" class="danger">删除所选</button>
      <button id="mgClear" class="danger">清空本分组</button>
      <button id="mgClose">完成</button>
    </div>
  </div>
</dialog>
<dialog id="importDlg">
  <div class="ph">导入自选</div>
  <div class="pad" id="impStep1">
    <p class="muted">支持：同花顺持仓 / 自选（直接复制表格粘贴，含"证券代码"列）、TradingView 导出的自选（.txt，如
      <code>NASDAQ:AAPL,SSE:600519,###分组</code>）、CSV 第一列为代码、或每行一个代码。</p>
    <input type="file" id="importFile" accept=".txt,.csv,.xls,.tsv">
    <textarea id="importText" rows="10" placeholder="把内容粘贴到这里，下一步会先让你确认再导入"></textarea>
    <div class="dlgbtns">
      <button id="importNext">下一步：预览</button>
      <button id="importCancel">关闭</button>
    </div>
    <p id="importMsg" class="muted"></p>
  </div>
  <div class="pad" id="impStep2" style="display:none">
    <div class="imp-head">
      <span id="impSummary"></span>
      <span>导入到
        <select id="impTarget"></select>
        <input id="impNewGroup" placeholder="新分组名称" style="display:none; width: 9rem">
      </span>
    </div>
    <div class="imp-tablewrap">
      <table id="impTable">
        <thead><tr><th><input type="checkbox" id="impAll" checked></th><th>原始代码</th><th>名称</th><th>识别为</th><th>市场</th><th>状态</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <label><input type="checkbox" id="importReplace"> 清空目标分组后再导入（不勾选则追加）</label>
    <div class="dlgbtns">
      <button id="impBack">返回修改</button>
      <button id="impConfirm" class="primary">确认导入</button>
    </div>
  </div>
</dialog>

<dialog id="updateDialog">
  <form method="dialog"><strong>检查更新</strong><button aria-label="关闭">×</button></form>
  <p><label><input type="checkbox" id="useNext"> 接收 next 测试版</label></p>
  <p id="updateResult" role="status"></p>
  <button id="installChecked" type="button" disabled>安装并重启</button>
</dialog>
<dialog id="etfPeersDialog" aria-labelledby="etfPeersTitle">
  <form method="dialog">
    <strong id="etfPeersTitle">同指数 ETF 对照</strong>
    <button aria-label="关闭" autofocus>×</button>
  </form>
  <div class="etf-peers-content">
    <div class="etf-peers-controls">
      <strong id="etfPeersIndex" hidden></strong>
      <button id="etfPeersReload" type="button">刷新报价</button>
    </div>
    <p id="etfPeersStatus" role="status"></p>
    <section id="etfDecomposition" aria-label="跨境 ETF 价差拆解" hidden></section>
    <div class="etf-peers-scroll" id="etfPeersResults" hidden>
      <table aria-label="同指数 ETF 报价">
        <thead><tr>
          <th scope="col">ETF</th>
          <th scope="col">最新价（元）</th>
          <th scope="col"><button type="button" data-sort="pct">涨跌幅</button></th>
          <th scope="col"><button type="button" data-sort="amount">成交额</button></th>
          <th scope="col">买一 / 卖一（元）</th>
          <th scope="col"><button type="button" data-sort="spreadBps">价差（基点）</button></th>
          <th scope="col"><button type="button" data-sort="premium">折溢价</button></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="etfPeersNotes" class="muted" hidden></p>
  </div>
</dialog>
<script src="klinecharts-9.8.12.js"></script>
<script src="main-chart.js?v=0.8.18"></script>
<script src="chart-drawings.js?v=klinechart"></script>
<script src="app.js?v=0.8.18"></script>
<script src="group-brief.js"></script>
<script src="etf-peers.js?v=0.8.18"></script>
<script src="intraday-context.js?v=klinechart"></script>
<script src="news.js?v=0.8.18" onerror="void 0"></script>
<script src="ecocal.js?v=0.8.18" onerror="void 0"></script>
</body>
</html>
